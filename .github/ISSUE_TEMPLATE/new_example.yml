name: New example proposal
description: Suggest a raylib example to port, or offer to port one
labels: [example]
body:
  - type: markdown
    attributes:
      value: |
        Adding an example touches four places and is deliberately mechanical — see
        [the four touchpoints](https://github.com/burinc/b12n-raylib-jlt/blob/main/docs/guide/example-catalog.md#adding-an-example--the-four-touchpoints).
        You're welcome to open a PR directly instead of an issue.

  - type: input
    id: name
    attributes:
      label: Proposed name
      description: The `bb` name, e.g. `shapes-easings` — lowercase, hyphenated.
    validations:
      required: true

  - type: input
    id: upstream
    attributes:
      label: Upstream raylib example, if it's a port
      description: e.g. `shapes/shapes_bouncing_ball`. Leave blank for an original.

  - type: textarea
    id: demonstrates
    attributes:
      label: What would it demonstrate?
      description: |
        Ideally something the existing 75 don't already cover — a raylib call, an
        FFI shape, or a drawing technique.
    validations:
      required: true

  - type: textarea
    id: ffi
    attributes:
      label: Does it need any new FFI bindings?
      description: |
        If it needs a raylib function nothing else here binds — especially one
        taking or returning a struct **by value** — say which. Those are the cases
        that need design thought rather than a mechanical port.

  - type: checkboxes
    id: offer
    attributes:
      label: Are you offering to write it?
      options:
        - label: Yes, I'd like to submit the PR
